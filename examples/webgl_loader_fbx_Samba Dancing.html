<!DOCTYPE html>
<html lang="en">
<head>
  <title>three.js - Samba Dancing</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../build/three.module.js",
        "three/addons/": "./jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import Stats from 'three/addons/libs/stats.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { AudioListener, Audio, AudioLoader } from 'three';

    let camera, scene, renderer, mixer, stats;
    const clock = new THREE.Clock();

    init();

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      // Cámara
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.set(100, 200, 300);

      // Escena
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x111133, 150, 800);

      // HDR de fondo
      const rgbeLoader = new RGBELoader();
      rgbeLoader.load('models/rgbe/venice_sunset_4k.hdr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.background = texture;
        scene.environment = texture;
      });

      // Luces
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(100, 200, 100);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Piso SIN textura (solo con código)
      const groundMaterial = new THREE.MeshStandardMaterial({
        color: 0x999999,
        metalness: 0.3,
        roughness: 0.8
      });

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(2000, 2000),
        groundMaterial
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Modelo FBX
      const loader = new FBXLoader();
      loader.load('models/fbx/Samba Dancing.fbx', function (object) {
        mixer = new THREE.AnimationMixer(object);
        const action = mixer.clipAction(object.animations[0]);
        action.play();

        object.traverse(function (child) {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            // Material moderno
            child.material = new THREE.MeshPhysicalMaterial({
              color: 0x00ffff,
              metalness: 0.9,
              roughness: 0.1,
              clearcoat: 0.9,
              transmission: 0.4,
              ior: 1.4,
              transparent: true
            });
          }
        });

        scene.add(object);
      });

      // Audio (opcional)
      const listener = new AudioListener();
      camera.add(listener);

      const sound = new Audio(listener);
      const audioLoader = new AudioLoader();
      audioLoader.load('models/rgbe/musicajejeje.mp3', function (buffer) {
        sound.setBuffer(buffer);
        sound.setLoop(true);
        sound.setVolume(0.5);
        sound.play();
      });

      // Render
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Controles
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 100, 0);
      controls.update();

      // Estadísticas
      stats = new Stats();
      container.appendChild(stats.dom);

      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(animate);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
      stats.update();
    }
  </script>
</body>
</html>

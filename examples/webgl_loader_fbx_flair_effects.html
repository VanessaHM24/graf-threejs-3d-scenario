<!DOCTYPE html>
<html lang="en">
<head>
  <title>three.js - Samba Dancing con efectos</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../build/three.module.js",
        "three/addons/": "./jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import Stats from 'three/addons/libs/stats.module.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { AudioListener, Audio, AudioLoader } from 'three';

    let camera, scene, renderer, mixer, stats;
    let rainParticles, rainGeometry, rainMaterial;
    let rainSpeed = 0.5;
    let fogNear = 150;
    let fogFar = 800;
    let fogColor = 0x111133;
    let sound, listener, audioStarted = false;
    const clock = new THREE.Clock();

    init();

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      // Cámara
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.set(100, 200, 300);

      // Escena
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(fogColor, fogNear, fogFar);

      // HDR
      const rgbeLoader = new RGBELoader();
      rgbeLoader.load('models/rgbe/venice_sunset_4k.hdr', function (texture) {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.background = texture;
        scene.environment = texture;
      });

      // Luces
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
      hemiLight.position.set(0, 200, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(100, 200, 100);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Piso
      const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.3, roughness: 0.8 });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), groundMaterial);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Modelo FBX
      const loader = new FBXLoader();
      loader.load('models/fbx/Samba Dancing.fbx', function (object) {
        mixer = new THREE.AnimationMixer(object);
        const action = mixer.clipAction(object.animations[0]);
        action.play();

        object.traverse(function (child) {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            child.material = new THREE.MeshPhysicalMaterial({
              color: 0x00ffff,
              metalness: 0.9,
              roughness: 0.1,
              clearcoat: 0.9,
              transmission: 0.4,
              ior: 1.4,
              transparent: true
            });
          }
        });

        scene.add(object);
      });

      // Partículas de lluvia
      const rainCount = 1500;
      rainGeometry = new THREE.BufferGeometry();
      const positions = [];

      for (let i = 0; i < rainCount; i++) {
        positions.push(
          Math.random() * 1000 - 500,
          Math.random() * 500,
          Math.random() * 1000 - 500
        );
      }

      rainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      rainMaterial = new THREE.PointsMaterial({ color: 0x00aaff, size: 2 });
      rainParticles = new THREE.Points(rainGeometry, rainMaterial);
      scene.add(rainParticles);

      // Audio
      setupAudio();

      // Render
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Controles
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 100, 0);
      controls.update();

      // Stats
      stats = new Stats();
      container.appendChild(stats.dom);

      // Eventos
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('keydown', handleKeydown);
      window.addEventListener('click', tryStartAudio);
      renderer.setAnimationLoop(animate);
    }

    function setupAudio() {
      listener = new AudioListener();
      camera.add(listener);
      sound = new Audio(listener);
      const audioLoader = new AudioLoader();
      audioLoader.load('models/rgbe/musicajejeje.mp3', function (buffer) {
        sound.setBuffer(buffer);
        sound.setLoop(true);
        sound.setVolume(0.5);
      });
    }

    function tryStartAudio() {
      if (!audioStarted && sound && sound.buffer) {
        sound.play();
        audioStarted = true;
      }
    }

    function handleKeydown(event) {
      const pos = rainGeometry.attributes.position.array;

      // Lluvia: velocidad
      if (event.key === 'ArrowUp') rainSpeed += 0.1;
      if (event.key === 'ArrowDown') rainSpeed = Math.max(0.1, rainSpeed - 0.1);

      // Lluvia: color
      if (event.key === 'r') rainMaterial.color.set(0xff0000);
      if (event.key === 'g') rainMaterial.color.set(0x00ff00);
      if (event.key === 'b') rainMaterial.color.set(0x0000ff);
      if (event.key === 'w') rainMaterial.color.set(0xffffff);

      // Lluvia: viento
      if (event.key === 'v') {
        for (let i = 0; i < pos.length; i += 3) {
          pos[i] += 5;
        }
        rainGeometry.attributes.position.needsUpdate = true;
      }

      // Niebla: densidad
      if (event.key === 'ArrowLeft') {
        fogNear = Math.max(0, fogNear - 10);
        scene.fog.near = fogNear;
      }
      if (event.key === 'ArrowRight') {
        fogNear = Math.min(fogFar - 10, fogNear + 10);
        scene.fog.near = fogNear;
      }

      // Niebla: color
      if (event.key === 'a') scene.fog.color.set(0xff0000);
      if (event.key === 's') scene.fog.color.set(0x00ff00);
      if (event.key === 'd') scene.fog.color.set(0x0000ff);
      if (event.key === 'f') scene.fog.color.set(0xffffff);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      const pos = rainGeometry.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3) {
        pos[i + 1] -= rainSpeed;
        if (pos[i + 1] < 0) pos[i + 1] = 500;
      }
      rainGeometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
      stats.update();
    }
  </script>
</body>
</html>
